name: job-agent

# One backend image; api / worker / beat / migrate differ only by command.
x-backend: &backend
  build: ./backend
  image: job-agent-backend:latest
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://jobagent:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/jobagent
    REDIS_URL: redis://redis:6379/0
    CONFIG_DIR: /config
  volumes:
    - ./config:/config:ro
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: jobagent
      POSTGRES_DB: jobagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobagent -d jobagent"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Runs database migrations once, then exits. Everything else waits for it.
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    # Bound to localhost only: there is no login yet. Reach it via SSH tunnel.
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    <<: *backend
    command: ["celery", "-A", "app.celery_app:celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # The scheduler: this is what makes the agent run unattended. Its "last ran at" notes live on a
  # volume, so a restart doesn't reset the timers and a daily run missed while the host was asleep
  # happens as soon as it's back.
  beat:
    <<: *backend
    command: ["celery", "-A", "app.celery_app:celery_app", "beat", "--loglevel=info",
              "--schedule", "/var/lib/job-agent/celerybeat-schedule"]
    volumes:
      - ./config:/config:ro
      - beatstate:/var/lib/job-agent
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  beatstate:
