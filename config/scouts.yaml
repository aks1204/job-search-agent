# Scouts: where the agent discovers companies. Read-only in the dashboard:
# edit this file, then `docker compose restart`.
# Schedules use app.yaml's timezone (IST by default). Quote all values.

seeds:            # config/seed_companies.yaml — also loaded every time the worker starts
  enabled: true
  schedule: {hour: "5", minute: "0"}

packs:            # curated optional lists in config/seed_packs/ — judged like everyone else
  enabled: true
  schedule: {hour: "5", minute: "10"}
  enabled_packs: ["gcc_india", "india_large", "india_unicorns"]

# "Companies like the ones you keep": for each kept company, the cheap AI model suggests
# similar employers; a suggestion is used only if its website is live and names the company.
# OWNER DECISION (2026-10-11): deliberately relaxes spec §1.1 "MNC universe comes from a seed
# list, not discovery". Set enabled: false to return to the spec's original behaviour.
peers:
  enabled: true
  schedule: {hour: "7", minute: "30"}
  companies_per_run: 10          # kept companies expanded per day
  suggestions_per_company: 5

yc:               # public YC directory (yc-oss mirror; ycombinator.com is not scraped)
  enabled: true
  schedule: {hour: "5", minute: "30"}
  min_batch_year: 2022
  require_hiring: true
  regions_any: ["India", "Remote"]      # keep companies whose regions/locations mention any of these

# YC's Work at a Startup — public, logged-out category pages only (newest ~25-30 jobs each).
# OWNER DECISION (2026-10-12): relaxes spec §7.2 "never crawl Work-at-a-Startup". robots.txt
# allows it; the agent never logs in. Set enabled: false to restore the original rule.
waas:
  enabled: true
  schedule: {hour: "6", minute: "45"}
  categories: ["product-manager", "operations", "finance", "science"]

adzuna:           # needs ADZUNA_APP_ID + ADZUNA_APP_KEY in .env (free)
  enabled: true
  schedule: {hour: "6", minute: "0"}
  country: "in"
  max_days_old: 21
  results_per_page: 50
  pages_per_role: 2

jooble:           # needs JOOBLE_API_KEY in .env (free)
  enabled: true
  schedule: {hour: "6", minute: "15"}
  location: "India"

remotive:         # no key needed
  enabled: true
  schedule: {hour: "6", minute: "30"}
  limit: 100
  locations_any: ["worldwide", "anywhere", "india", "asia", "apac"]

hn:               # "Ask HN: Who is hiring?" via the official HN API
  enabled: true
  schedule: {day_of_month: "2,16", hour: "7", minute: "0"}
  max_comments_per_run: 1500

resolver:         # finds the website of companies seen only by name (needs BRAVE_API_KEY)
  interval_minutes: 60
  batch_size: 25
  max_attempts: 4
  brave_monthly_budget: 600     # of the ~2,000 free searches/month; the rest is kept for later modules

company_name_skiplist: ["confidential", "company name withheld", "undisclosed", "stealth", "hiring company"]
