# Job rules (Module 2 §2.1). LOCKED: read-only in the dashboard. Edit + `docker compose restart`.
#
# Kind 1 — hard filters, applied before any AI cost. Titles are a broad net only: what a role
# really is (family, level) is read from the DESCRIPTION by the AI in the next step.
# Your role families and excluded families come from config/owner_stub.yaml.

kind1:
  max_age_days: 21
  allowed_employment_types: ["full_time"]     # unknown types pass; the AI read confirms
  # Obvious non-matches for an analytics / strategy career, matched as whole words in the
  # title (plurals and -ing forms included). Your excluded role families are added on top.
  noise_titles:
    - "intern"
    - "internship"
    - "apprentice"
    - "nurse"
    - "driver"
    - "technician"
    - "chemist"
    - "chemistry"
    - "biologist"
    - "microbiologist"
    - "pharmacist"
    - "physician"
    - "clinical research associate"
    - "medical science liaison"
    - "sales representative"
    - "account executive"
    - "attorney"
    - "counsel"
    - "paralegal"
    - "accountant"
    - "warehouse"
    - "mechanic"
    - "electrician"
    - "cashier"
    - "customer service representative"
    # Bank back-office and engineering roles (owner decision 2026-10-16: saves the daily AI reads)
    - "reference data"
    - "fund servicing"
    - "product controller"
    - "trading services"
    - "surveillance"
    - "credit documentation"
    - "disclosure of interest"
    - "external reporting"
    - "site reliability"

  # Titles that are clearly 2+ rungs above your current level (owner_stub.yaml level_ladder) are
  # dropped for free. "Associate Director"-style titles are ambiguous and go to the AI read instead.
  drop_titles_two_rungs_up: true
  senior_title_words: ["director", "vice president", "vp", "svp", "evp", "head of", "chief"]
  keep_title_phrases: ["associate director", "assistant director", "deputy director", "chief of staff"]

descriptions:
  per_run: 80     # full job descriptions fetched per 15-minute tick (only for jobs that passed Kind 1)

# Kind 2 — one AI read of each role's description (once per sibling cluster), then these rules.
kind2:
  max_reads_per_day: 150        # ≈ $0.10/day with the fast model
  reads_per_tick: 20
  # Services-flavoured work (client delivery, consulting projects for others) at a MIDDLE-tier brand: −10
  # in scoring. Exempt: companies on prestige_brands, and companies whose brand is "step up" or
  # "lateral" for you (Module 1's verdict, or your own call via `cli brand <domain> up|lateral|down`).
  services_penalty: 10
  prestige_brands:
    - "mckinsey.com"
    - "bcg.com"
    - "bain.com"
    - "goldmansachs.com"
    - "morganstanley.com"
    - "jpmorganchase.com"
    - "google.com"
    - "microsoft.com"
    - "amazon.com"
    - "apple.com"
    - "meta.com"

# Kind 3 — scoring (spec §2.3). Stage 1: free resume/profile similarity for every role that passed.
# Stage 2: the top grades_per_day by similarity get an AI grade (stronger model). Final score =
# weighted average of the grade's dimensions (equal weights to start), minus penalties.
scoring:
  grades_per_day: 20
  grades_per_tick: 5
  weights:                     # equal to start; feedback tuning adjusts these (changes are logged)
    skills_fit: 1
    experience_fit: 1
    domain_fit: 1
    career_growth: 1
    brand_value: 1
    location_fit: 1
  bands: {fast_lane: 85, inbox: 65, maybe: 40}   # below maybe → archive
  # Tenure-aware lateral appetite: once you've been in your role this long, laterals score lower.
  lateral_tenure_years: 2
  lateral_penalty: 5
  # Roles not (yet) AI-graded are banded by similarity alone and never above Maybe; so are leads.
  ungraded_max_score: 64

# Pay must beat your current pay (owner_stub.yaml current_compensation). Within ±marginal_band of it →
# passes, flagged "comp: marginal". Foreign pay: remote-paid-from-abroad → nominal exchange rate;
# relocation → PPP-adjusted (World Bank factors, refreshed yearly). Unstated → AI estimate.
pay:
  marginal_band: 0.15
